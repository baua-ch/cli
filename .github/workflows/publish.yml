# Publishes @baua/cli to JSR when a tag v<version> is pushed (or made with a release on GitHub): the tag must match jsr.json and be on main.
# Then the tag gets a GitHub release, unless it has one. Started by hand from main, it publishes main's version (e.g. after a failed run).
# JSR's OIDC publishing: no token is stored; this repository is linked to the package on jsr.io.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: The tag matches jsr.json and is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./jsr.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not v$version (the version in jsr.json)"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - run: npm ci

      - run: npm test

  # Only this job may request the OIDC token, and it installs nothing but the pinned jsr CLI.
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npx --yes jsr@0.14.3 publish

  # A tag pushed with git has no release yet: make one, so every published version shows on GitHub.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: |
          version="$(node -p 'require("./jsr.json").version')"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version has a release"
            exit 0
          fi

          gh release create "v$version" --target "$GITHUB_SHA" --title "$version" --generate-notes --notes "Published on JSR as [@baua/cli@$version](https://jsr.io/@baua/cli@$version)."
        env:
          GH_TOKEN: ${{ github.token }}
